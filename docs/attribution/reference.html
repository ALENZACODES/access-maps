<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><title>Offline source reference register</title><link rel="stylesheet" href="reference.css"></head>
<body><a class="skip" href="#main">Skip to main content</a><header><h1 id="title">Offline source reference register</h1><p id="intro">Read a local release pack to inspect recorded sources and licence evidence. Nothing is uploaded.</p></header><main id="main"><div id="app"><div class="field"><label id="language-label" for="language">Language</label><select id="language"><option value="en">English</option><option value="fr">Français</option></select></div><div class="field"><label id="current-label" for="current">Choose a reference pack</label><input id="current" type="file" accept=".json,application/json"></div><div class="field"><label id="previous-label" for="previous">Choose an earlier pack (optional)</label><input id="previous" type="file" accept=".json,application/json"></div><button id="run" type="button"><span id="run-label">Examine records</span></button><p id="help">The report records source evidence only. It does not assess conditions at any location.</p><p id="status" role="status" aria-live="polite">Choose a local JSON file to begin.</p><nav aria-label="Report actions"><button id="save-text" type="button"><span id="text-label">Save text report</span></button><button id="save-json" type="button"><span id="json-label">Save JSON report</span></button><button id="save-html" type="button"><span id="html-label">Save HTML report</span></button><button id="print" type="button"><span id="print-label">Print results</span></button></nav><section id="report" aria-label="Reference report"></section></div></main><script type="module" src="reference-route.mjs"></script></body></html>
