name: seed-audit

on:
  pull_request:
    paths:
      - "tools/seed-audit/**"
      - ".github/workflows/seed-audit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/seed-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/seed-audit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
