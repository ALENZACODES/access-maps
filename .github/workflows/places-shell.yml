name: places-shell

on:
  pull_request:
    paths:
      - "packages/places-shell/**"
      - ".github/workflows/places-shell.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/places-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/places-shell/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
