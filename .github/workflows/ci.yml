name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - run: npm run check:schema
        if: hashFiles('package-lock.json') != ''
      - run: npm run lint
        if: hashFiles('package-lock.json') != ''
      - run: npm test
        if: hashFiles('package-lock.json') != ''
      - run: npm run validate:sample
        if: hashFiles('package-lock.json') != ''
