name: P15J offline handoff QA
on:
  pull_request:
    paths:
      - 'tools/data-qa/p15j-**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tools/data-qa/README-P15J.md'
      - '.github/workflows/p15j-data-qa.yml'
permissions:
  contents: read
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Strict root TypeScript check
        run: npx tsc --noEmit
      - name: Run P15J blocking audit tests
        run: node --import tsx --test tools/data-qa/p15j-*.test.ts
      - name: Check callable audit CLI
        run: node --import tsx tools/data-qa/p15j-cli.ts --help
